appId: com.pantallapc.app
productName: PantallaPC
directories:
  buildResources: build
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md,AGENTS.md}'
  - '!{.env,.env.*,.npmrc,package-lock.json}'
  - '!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}'
extraResources:
  - from: out/client-viewer
    to: client-viewer
asarUnpack:
  - resources/**
win:
  # Carpeta con PantallaPC.exe (sin instalador): los datos quedan en ./data
  # junto al ejecutable. Sin firma de codigo.
  artifactName: ${name}-${version}-${arch}.${ext}
  executableName: PantallaPC
  target:
    - dir
nsis: null
mac:
  artifactName: ${name}-${version}-${arch}.${ext}
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo: []
  notarize: false
dmg:
  artifactName: ${name}-${version}-${arch}.${ext}
linux:
  target:
    - AppImage
    - rpm
    - deb
    # - snap
  maintainer: electronjs.org
  category: Utility
appImage:
  artifactName: ${name}-${version}-${arch}.${ext}
npmRebuild: false
publish: null
# Usa el Electron ya instalado en node_modules (sin descargar otro).
electronDist: node_modules/electron/dist
